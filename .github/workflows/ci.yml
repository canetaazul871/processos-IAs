name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Build noturno diário às 03:17 UTC (minuto fora de :00 de propósito).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Testes (pytest)
        run: pytest -q
